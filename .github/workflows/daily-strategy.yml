name: Daily Strategy

on:
  schedule:
    # 09:00 UTC = 5am ET (EDT) / 4am ET (EST) / 2am PT (PDT).
    # GitHub Actions cron is always UTC; it does not respect local DST.
    - cron: '0 9 * * *'
  workflow_dispatch: {}
  # Also re-run when the strategist itself changes — safe because the
  # bot only writes under strategy/daily/ and strategy/latest.md, neither
  # of which is in the paths list, so there's no self-trigger loop.
  push:
    paths:
      - 'scripts/daily_strategy.py'
      - 'strategy/CONTEXT.md'
      - '.github/workflows/daily-strategy.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-strategy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN persists for git push back to the branch.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Anthropic SDK
        run: |
          python -m pip install --upgrade pip
          pip install 'anthropic>=0.40,<1'

      - name: Verify secret is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set"
            mkdir -p strategy
            printf '%s SECRET_MISSING\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > strategy/last_run.log
            echo "ANTHROPIC_API_KEY repo secret was not found." >> strategy/last_run.log
            exit 1
          fi
          echo "Secret present (prefix ${ANTHROPIC_API_KEY:0:10}...)"

      - name: Generate today's plan
        if: success()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_strategy.py

      - name: Show last_run.log in workflow output
        if: always()
        run: |
          echo "--- strategy/last_run.log ---"
          cat strategy/last_run.log 2>/dev/null || echo "(no log produced)"

      - name: Commit and push if changed
        if: always()
        id: commit
        continue-on-error: true
        run: |
          git config user.name  'supershorts-strategy-bot'
          git config user.email 'strategy-bot@users.noreply.github.com'
          mkdir -p strategy strategy/daily
          git add -A strategy/
          if git diff --cached --quiet; then
            echo "No strategy changes to commit."
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          status=$(head -n 1 strategy/last_run.log 2>/dev/null | awk '{print $2}')
          status=${status:-UNKNOWN}
          git commit -m "chore(strategy): ${today} run — ${status}"
          git push

      - name: Open diagnostic issue when run fails or push fails
        if: always() && (failure() || steps.commit.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Daily-strategy workflow failed on \`${GITHUB_REF_NAME}\`."
            echo
            echo "**Run:** ${run_url}"
            echo
            echo '```'
            cat strategy/last_run.log 2>/dev/null || echo "(no log produced — script never wrote one)"
            echo '```'
          } > /tmp/issue_body.md
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "[strategy-bot] run failed at ${today}" \
            --body-file /tmp/issue_body.md \
            --label "strategy-bot" 2>/tmp/issue_err || {
              # Label may not exist yet; retry without it.
              gh issue create \
                --repo "${GITHUB_REPOSITORY}" \
                --title "[strategy-bot] run failed at ${today}" \
                --body-file /tmp/issue_body.md
            }
