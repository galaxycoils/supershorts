name: Daily Strategy

on:
  schedule:
    # 09:00 UTC = 5am ET (EDT) / 4am ET (EST) / 2am PT (PDT).
    # GitHub Actions cron is always UTC; it does not respect local DST.
    - cron: '0 9 * * *'
  workflow_dispatch: {}
  # Also re-run when the strategist itself changes — safe because the
  # bot only writes under strategy/daily/ and strategy/latest.md, neither
  # of which is in the paths list, so there's no self-trigger loop.
  push:
    paths:
      - 'scripts/daily_strategy.py'
      - 'strategy/CONTEXT.md'
      - '.github/workflows/daily-strategy.yml'

permissions:
  contents: write

concurrency:
  group: daily-strategy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Anthropic SDK
        run: |
          python -m pip install --upgrade pip
          pip install 'anthropic>=0.40,<1'

      - name: Generate today's plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_strategy.py

      - name: Commit and push if changed
        run: |
          git config user.name  'supershorts-strategy-bot'
          git config user.email 'strategy-bot@users.noreply.github.com'
          # Always include last_run.log so failures are visible on the
          # branch even when no plan was produced.
          git add strategy/latest.md strategy/daily/ strategy/last_run.log
          if git diff --cached --quiet; then
            echo "No strategy changes to commit."
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          status=$(head -n 1 strategy/last_run.log | awk '{print $2}')
          git commit -m "chore(strategy): ${today} run — ${status}"
          git push
