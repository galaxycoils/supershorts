<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="SuperShorts — AI-powered short-form video engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0820"/>
      <stop offset="55%" stop-color="#0F0B26"/>
      <stop offset="100%" stop-color="#1A1240"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.82" cy="0.18" r="0.35">
      <stop offset="0%" stop-color="#C9C2FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#C9BBFF"/>
      <stop offset="100%" stop-color="#7C9BFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#4C7DFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#moon)"/>

  <!-- eclipse: bright disc occluded by darker disc -->
  <g transform="translate(990,90)">
    <circle r="62" fill="#E8E2FF" opacity="0.28"/>
    <circle r="46" fill="#0F0B26"/>
    <circle r="46" fill="none" stroke="#C9BBFF" stroke-opacity="0.55" stroke-width="1"/>
  </g>

  <!-- decorative stars -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="120" cy="60" r="1.4"/>
    <circle cx="220" cy="40" r="1"/>
    <circle cx="340" cy="80" r="1.6"/>
    <circle cx="60"  cy="180" r="1"/>
    <circle cx="780" cy="50" r="1.2"/>
    <circle cx="850" cy="120" r="1"/>
    <circle cx="430" cy="30" r="1"/>
    <circle cx="540" cy="260" r="1.2"/>
    <circle cx="700" cy="280" r="1"/>
    <circle cx="160" cy="270" r="1.4"/>
    <circle cx="1080" cy="220" r="1"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800">
    <text x="80" y="170" font-size="92" letter-spacing="-2" fill="url(#text)">SUPERSHORTS</text>
    <text x="80" y="172" font-size="92" letter-spacing="-2" fill="none" stroke="url(#accent)" stroke-opacity="0.25" stroke-width="0.6" filter="url(#soft)">SUPERSHORTS</text>
  </g>

  <!-- tagline -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif">
    <text x="82" y="218" font-size="22" font-weight="500" fill="#C9C2FF" opacity="0.92">
      AI-powered short-form video engine — generate, render, upload on autopilot.
    </text>
    <text x="82" y="258" font-size="13" font-weight="600" fill="#9A8FE0" letter-spacing="3">
      LOCAL LLMs · PIPER TTS · MOVIEPY · FLASK
    </text>
  </g>

  <!-- subtle bottom hairline accent -->
  <rect x="80" y="278" width="120" height="2" rx="1" fill="url(#accent)"/>
</svg>
