services:
  supershorts:
    build: .
    container_name: supershorts
    expose:
      - "5050"
    volumes:
      - ./output:/app/output
      - ${FIREFOX_PROFILE:-~/.mozilla/firefox/youtube_uploader}:/home/appuser/.mozilla/firefox/youtube_uploader:rw
      - ${PIPER_VOICES:-~/.local/share/piper-tts}:/home/appuser/.local/share/piper-tts:ro
    env_file:
      - .env
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      - OLLAMA_URL=http://ollama:11434
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - ollama
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - supershorts
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
